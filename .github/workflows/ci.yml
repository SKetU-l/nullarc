name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make

    - name: Fetch Phoenix firmware fixtures (linux-firmware)
      run: make fixtures

    - name: Build and run unit tests
      env:
        REQUIRE_FIXTURES: "1"
      run: |
        make test CXX=clang++
